services:
  - type: web
    name: ruchiloka-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:api
    startCommand: npm --workspace=@ruchiloka/api run prisma:migrate:deploy && npm --workspace=@ruchiloka/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: ruchiloka-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: ENABLE_SWIGGY_API_HANDOFF
        value: "false"
      - key: ENABLE_ZOMATO_API_HANDOFF
        value: "false"

databases:
  - name: ruchiloka-postgres
    plan: basic-256mb
    region: singapore
    databaseName: ruchiloka
    user: ruchiloka_admin
