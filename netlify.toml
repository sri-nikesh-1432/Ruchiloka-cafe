[build]
  command = "npm run build:shared && npm run build:api && npm run build:web"
  publish = "apps/web/out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

[functions."api"]
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "apps/api/prisma/schema.prisma",
    "!**/query_engine-windows.dll.node",
    "!**/libquery_engine-debian*",
    "!**/libquery_engine-darwin*",
    "!node_modules/@prisma/engines/**",
    "!**/*.wasm",
    "!node_modules/@prisma/client/runtime/*wasm*",
    "!apps/api/node_modules/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true
